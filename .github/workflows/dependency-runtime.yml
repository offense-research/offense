name: Dependency runtime acceptance
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build public runtime
        run: docker build -f agent/hermes.Dockerfile -t offense-hermes:test .
      - name: Exercise actual Hermes with a synthetic model and no external network
        run: >-
          docker run --rm --init --read-only --network none --cap-drop ALL
          --security-opt no-new-privileges --user 1000:1000 --pids-limit 128
          --memory 2g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=256m
          --entrypoint node offense-hermes:test --disable-sigusr1
          /opt/purple/agent/hermes-smoke.mjs --inside-image
      - name: Repair, independently verify, export and stub-publish a synthetic upgrade
        run: node scripts/ci/dependency-acceptance.mjs --image offense-hermes:test --output "$RUNNER_TEMP/dependency-acceptance"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: dependency-acceptance
          path: ${{ runner.temp }}/dependency-acceptance/
          retention-days: 7
          if-no-files-found: warn
