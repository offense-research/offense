name: Dependency runtime acceptance
on:
  pull_request:
    paths:
      - 'agent/**'
      - 'offense/**'
      - 'scripts/ci/**'
      - '.github/offense/**'
      - '.github/workflows/dependency-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build public runtime
        run: docker build -f agent/hermes.Dockerfile -t offense-hermes:test .
      - name: Exercise actual Hermes with a synthetic model and no external network
        run: >-
          docker run --rm --init --read-only --network none --cap-drop ALL
          --security-opt no-new-privileges --user 1000:1000 --pids-limit 128
          --memory 2g --cpus 2 --tmpfs /tmp:rw,nosuid,nodev,size=256m
          --entrypoint node offense-hermes:test --disable-sigusr1
          /opt/purple/agent/hermes-smoke.mjs --inside-image
